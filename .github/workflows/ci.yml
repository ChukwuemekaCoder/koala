name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --break-system-packages
          pip install ruff --break-system-packages

      - name: Lint
        run: ruff check .

      # DB-backed tests (test_catalog.py, test_schedule_endpoints.py,
      # test_integration.py) need a real DATABASE_URL/SUPABASE_URL/
      # SUPABASE_ANON_KEY/SUPABASE_SERVICE_ROLE_KEY pointing at a
      # Supabase project with db/seed_test_catalog.sql applied. These
      # are repo secrets (Settings > Secrets and variables > Actions),
      # same 4 names/values as backend/.env locally — see
      # .env.example for where each one comes from in the Supabase
      # dashboard. Explicit decision made to point CI at the same
      # dev/demo project already used for manual testing, consistent
      # with this project running on synthetic/mock data throughout.
      - name: Run tests
        run: pytest -v
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  build-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t oru-scheduler-backend backend/

  deploy:
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
